<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq AI Yordamchi (v2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        
        .markdown-body p { margin-bottom: 0.8rem; }
        .markdown-body h1, .markdown-body h2 { font-weight: bold; margin-top: 1rem; color: #93c5fd; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; }
        .markdown-body pre { background: #111827; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; border: 1px solid #374151; margin: 1rem 0; }
        .markdown-body code { font-family: monospace; color: #e5e7eb; }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400 flex items-center gap-2">
                <i class="fa-solid fa-robot"></i> Groq AI
            </h1>
            <div class="text-xs text-gray-500">v2.0 (Debug Mode)</div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto w-full p-4 flex flex-col gap-4">

        <!-- 1. API Key Section (CRITICAL) -->
        <div class="bg-gray-800 p-4 rounded-lg border border-blue-900 shadow-lg">
            <label class="block text-blue-300 text-sm font-bold mb-2">
                1-QADAM: API Kalitni shu yerga qo'ying
            </label>
            <div class="flex gap-2">
                <input type="password" id="apiKey" 
                    class="flex-grow bg-gray-900 text-white border border-gray-600 rounded p-2 focus:border-blue-500 focus:outline-none"
                    placeholder="gsk_..." 
                    value=""> <!-- Xavfsizlik uchun bo'sh qoldirildi -->
                <button onclick="toggleVisibility()" class="bg-gray-700 px-3 rounded text-gray-300 hover:bg-gray-600">
                    <i class="fa-solid fa-eye" id="eyeIcon"></i>
                </button>
            </div>
            <p class="text-xs text-gray-500 mt-1">
                Siz bergan kalit: <code>gsk_...F4MprJ</code> (shuni nusxalab tepaga qo'ying)
            </p>
        </div>

        <!-- 2. Chat Area -->
        <div class="flex-grow bg-gray-800 rounded-lg border border-gray-700 flex flex-col min-h-[400px]">
            <!-- Messages Log -->
            <div id="chatLog" class="flex-grow p-4 overflow-y-auto space-y-4">
                <div class="bg-blue-900/30 p-3 rounded-lg border border-blue-800 text-sm text-blue-200">
                    👋 Salom! Men Groq AI yordamchisiman. Ishlatish uchun tepaga API kalitingizni kiriting va pastda savol yozing.
                </div>
            </div>

            <!-- Error Display Area -->
            <div id="errorArea" class="hidden bg-red-900/80 p-3 text-red-100 text-sm text-center border-t border-red-700">
                <!-- Error message will go here -->
            </div>

            <!-- Input Area -->
            <div class="p-4 border-t border-gray-700 bg-gray-800 rounded-b-lg">
                <div class="relative">
                    <textarea id="prompt" rows="2" 
                        class="w-full bg-gray-900 text-white border border-gray-600 rounded-lg p-3 pr-12 focus:border-blue-500 focus:outline-none resize-none"
                        placeholder="Savolingizni yozing (masalan: React nima?)..."></textarea>
                    
                    <button id="sendBtn" onclick="sendMessage()" 
                        class="absolute right-2 bottom-2 bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                    
                    <div id="loadingIndicator" class="hidden absolute right-12 bottom-3">
                        <div class="loader"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // System prompt setup
        const SYSTEM_PROMPT = "You are a helpful AI assistant. Answer in Uzbek language explicitly.";

        // Toggle API Key visibility
        function toggleVisibility() {
            const input = document.getElementById('apiKey');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function appendMessage(role, text, isError = false) {
            const chatLog = document.getElementById('chatLog');
            const div = document.createElement('div');
            
            if (role === 'user') {
                div.className = "bg-gray-700 text-white p-3 rounded-lg self-end ml-10 border border-gray-600";
                div.innerText = text;
            } else if (isError) {
                div.className = "bg-red-900/50 text-red-200 p-3 rounded-lg border border-red-800 text-sm";
                div.innerHTML = `<strong class="block mb-1"><i class="fa-solid fa-triangle-exclamation"></i> Xatolik:</strong> ${text}`;
            } else {
                div.className = "bg-gray-900/50 text-gray-100 p-4 rounded-lg mr-10 border border-gray-700 markdown-body";
                div.innerHTML = marked.parse(text);
            }
            
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        async function sendMessage() {
            const apiKeyInput = document.getElementById('apiKey');
            const promptInput = document.getElementById('prompt');
            const errorArea = document.getElementById('errorArea');
            const sendBtn = document.getElementById('sendBtn');
            const loading = document.getElementById('loadingIndicator');

            const apiKey = apiKeyInput.value.trim();
            const text = promptInput.value.trim();

            // Reset Errors
            errorArea.classList.add('hidden');
            errorArea.innerText = '';

            // Validation
            if (!apiKey) {
                errorArea.innerText = "⚠️ Iltimos, API Kalitni kiriting! (Tepadagi maydon)";
                errorArea.classList.remove('hidden');
                apiKeyInput.focus();
                apiKeyInput.classList.add('border-red-500');
                setTimeout(() => apiKeyInput.classList.remove('border-red-500'), 2000);
                return;
            }

            if (!text) return;

            // UI Updates
            promptInput.value = '';
            appendMessage('user', text);
            sendBtn.disabled = true;
            loading.classList.remove('hidden');

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [
                            { role: "system", content: SYSTEM_PROMPT },
                            { role: "user", content: text }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    let errorMsg = "Noma'lum xatolik";
                    if (data.error) errorMsg = data.error.message;
                    if (response.status === 401) errorMsg = "API Kalit noto'g'ri (401 Unauthorized). Kalitni tekshiring.";
                    if (response.status === 429) errorMsg = "Limit tugadi (Rate Limit). Biroz kuting.";
                    
                    throw new Error(errorMsg);
                }

                const aiReply = data.choices[0].message.content;
                appendMessage('ai', aiReply);

            } catch (err) {
                console.error(err);
                appendMessage('ai', `Uzur, so'rovni bajarib bo'lmadi.\n\nSababi: **${err.message}**`, true);
            } finally {
                sendBtn.disabled = false;
                loading.classList.add('hidden');
                document.getElementById('prompt').focus();
            }
        }

        // Enter key to send
        document.getElementById('prompt').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
